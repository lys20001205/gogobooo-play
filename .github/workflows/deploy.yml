name: Publish playable export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout export repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify and unpack exported game
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --strict --check UPLOADS.sha256
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import gzip, hashlib, shutil, stat, zipfile
          expected = {}
          for line in Path('SITE.sha256').read_text().splitlines():
              digest, name = line.split('  ', 1)
              path = PurePosixPath(name)
              assert len(digest) == 64 and all(c in '0123456789abcdef' for c in digest)
              assert not path.is_absolute() and '..' not in path.parts and name == path.as_posix()
              assert name not in expected
              expected[name] = digest
          binary_archives = {
              'godot/index.wasm': 'godot-engine.wasm.gz',
              'godot/index.pck': 'game-data.pck.gz',
          }
          assert set(binary_archives).issubset(expected)
          target = Path('_site')
          target.mkdir(exist_ok=False)
          with zipfile.ZipFile('web-shell.zip') as archive:
              entries = archive.infolist()
              names = [entry.filename for entry in entries]
              assert len(names) == len(set(names))
              assert set(names) == set(expected) - set(binary_archives)
              for entry in entries:
                  assert not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16)
                  destination = target / entry.filename
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(entry) as source, destination.open('wb') as output:
                      shutil.copyfileobj(source, output)
          for name, filename in binary_archives.items():
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              with gzip.open(filename, 'rb') as source, destination.open('wb') as output:
                  shutil.copyfileobj(source, output)
          actual = {p.relative_to(target).as_posix() for p in target.rglob('*') if p.is_file()}
          assert actual == set(expected)
          for name, digest in expected.items():
              path = target / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              print(f'Verified {name}: {path.stat().st_size} bytes')
          PY
          (cd _site && sha256sum --strict --check ../SITE.sha256)
      - name: Assemble verified isolated Android test download
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          """Add verified runtime APK to existing verified Pages output, preserving old bytes."""
          from pathlib import Path, PurePosixPath
          import hashlib,json,re
          meta=json.loads(Path('ANDROID_EXPORT.json').read_text())
          assert set(meta)=={'schema','filename','bytes','sha256','chunks','build_manifest_sha256'}
          assert meta['schema']=='gogobooo-isolated-android-export-v1'
          assert meta['filename']=='gogobooo-gi-test.apk'
          assert type(meta['bytes']) is int and 0<meta['bytes']<=128*1024*1024
          for key in ['sha256','build_manifest_sha256']:assert re.fullmatch(r'[0-9a-f]{64}',meta[key])
          assert isinstance(meta['chunks'],list) and 0<len(meta['chunks'])<=512
          names=set();total=0
          for i,chunk in enumerate(meta['chunks']):
              assert set(chunk)=={'path','bytes','sha256'}
              assert chunk['path']==f'android-upload/apk.part-{i:04d}'
              assert type(chunk['bytes']) is int and 0<chunk['bytes']<=1024*1024
              assert re.fullmatch(r'[0-9a-f]{64}',chunk['sha256'])
              names.add(chunk['path']);total+=chunk['bytes']
          assert total==meta['bytes']
          source=Path('android-upload');assert source.is_dir() and not source.is_symlink()
          assert {p.as_posix() for p in source.rglob('*') if p.is_file()}==names
          assert all(not p.is_symlink() and p.is_file() for p in source.iterdir())
          manifest=Path('android-build-manifest.json');assert not manifest.is_symlink()
          build=manifest.read_bytes();assert hashlib.sha256(build).hexdigest()==meta['build_manifest_sha256']
          assert isinstance(json.loads(build),dict)
          target=Path('_site/gi-android');target.mkdir(exist_ok=False)
          output=target/meta['filename'];hasher=hashlib.sha256()
          with output.open('xb') as out:
              for chunk in meta['chunks']:
                  data=Path(chunk['path']).read_bytes()
                  assert len(data)==chunk['bytes'] and hashlib.sha256(data).hexdigest()==chunk['sha256']
                  hasher.update(data);out.write(data)
          assert output.stat().st_size==meta['bytes'] and hasher.hexdigest()==meta['sha256']
          assert output.read_bytes()[:4]==b'PK\x03\x04'
          (target/'build-manifest.json').write_bytes(build)
          (target/'SHA256SUMS.txt').write_text(meta['sha256']+'  '+meta['filename']+'\n')
          original={}
          for line in Path('SITE.sha256').read_text().splitlines():
              digest,name=line.split('  ',1);original[name]=digest
          for name,digest in original.items():assert hashlib.sha256((Path('_site')/name).read_bytes()).hexdigest()==digest,name
          new={'gi-android/'+n for n in [meta['filename'],'build-manifest.json','SHA256SUMS.txt']}
          assert {p.relative_to('_site').as_posix() for p in Path('_site').rglob('*') if p.is_file()}==set(original)|new
          print(f'Verified Android APK: {meta["bytes"]} bytes, SHA256 {meta["sha256"]}; original game unchanged')
          PY
      - name: Upload verified site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
